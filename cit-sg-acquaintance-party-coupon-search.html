const DATA = RAW.split("\n").map(l => {
  const i = l.indexOf("|");
  return { num: l.slice(0, i), name: l.slice(i + 1) };
});

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
DATA.forEach(d => d.key = norm(d.num + " " + d.name));

const q = document.getElementById("q");
const list = document.getElementById("results");
const count = document.getElementById("count");

function esc(s){return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function highlight(text, tokens){
  if(!tokens.length) return esc(text);
  // build normalized text with index map to preserve original accents
  let out = "", i = 0;
  const n = norm(text);
  const marks = new Array(text.length).fill(false);
  // normalized length can differ only for decomposed chars; ñ/é compose to single char so lengths match here
  if (n.length === text.length) {
    tokens.forEach(t => {
      let p = 0;
      while ((p = n.indexOf(t, p)) !== -1) { for (let k = p; k < p + t.length; k++) marks[k] = true; p += t.length; }
    });
    let open = false;
    for (let k = 0; k < text.length; k++) {
      if (marks[k] && !open) { out += "<mark>"; open = true; }
      if (!marks[k] && open) { out += "</mark>"; open = false; }
      out += esc(text[k]);
    }
    if (open) out += "</mark>";
    return out;
  }
  return esc(text);
}

function render(){
  const raw = q.value.trim();
  const tokens = norm(raw).split(/\s+/).filter(Boolean);
  const res = tokens.length ? DATA.filter(d => tokens.every(t => d.key.includes(t))) : DATA;
  count.textContent = tokens.length
    ? `${res.length} result${res.length === 1 ? "" : "s"} found`
    : `Showing all ${DATA.length} coupons`;
  if (!res.length) { list.innerHTML = '<div class="empty">No matching coupon found.</div>'; return; }
  list.innerHTML = res.map(d =>
    `<li><span class="num">${highlight(d.num, tokens)}</span><span class="name">${highlight(d.name, tokens)}</span></li>`
  ).join("");
}

q.addEventListener("input", render);
document.getElementById("clear").addEventListener("click", () => { q.value = ""; render(); q.focus(); });
render();
